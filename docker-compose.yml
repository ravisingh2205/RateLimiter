# docker compose up -d postgres redis      -> just the infrastructure (run the app from your IDE / mvn)
# docker compose up --build                -> infrastructure + the app on http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ratelimiter
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ratelimiter
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratelimiter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: infra
      DB_URL: jdbc:postgresql://postgres:5432/ratelimiter
      DB_USER: ratelimiter
      DB_PASSWORD: ratelimiter
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ADMIN_TOKEN: changeme
    ports:
      - "8080:8080"
